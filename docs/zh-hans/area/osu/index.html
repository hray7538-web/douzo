<h1>大须</h1>
<p class="sub">老商店街与个人小店，便宜又有活力。很多是老板一人经营，只用电话接受预约。</p>
<ul class="chips"><li>用您的语言直接写</li><li>一天内确认</li><li>无需下载App、无需注册</li></ul>
<div class="box">
<h2>您想预约什么？</h2>
<textarea id="q" placeholder="例如：周五晚上7点左右2位，荣附近。不要猪肉。每人预算约5,000日元。"></textarea>
<div class="btns">
<button class="p" id="m" type="button">用邮件发送</button>
<button class="s" id="c" type="button" data-done="已复制">复制</button>
</div>
<p class="note">确认后会通知您。如果第一家满了，我们会找下一家。</p>
</div>
<h2 class="sec">为什么需要</h2><ul class="why"><li>名古屋大部分好店只接受<b>电话、日语</b>预约。</li><li>日本的订位网站是日文的，外国人无法使用。</li><li>您不需要学日语。告诉我们就好。</li></ul>
<a class="back" href="https://yoyoi.jp/zh-hans/">← ヨヨイ</a>

<footer><div class="wrap">ヨヨイ Yoyoi — 名古屋 · <a href="https://yoyoi.jp/en/">English</a></div></footer>
<script>(function(){
var t=document.getElementById('q'),m=document.getElementById('m'),c=document.getElementById('c');
if(!t)return;
function body(){return encodeURIComponent(t.value||'');}
if(m)m.addEventListener('click',function(){
  location.href='mailto:hray7538@gmail.com?subject='+encodeURIComponent('Yoyoi — booking request')+'&body='+body();});
if(c)c.addEventListener('click',function(){
  var d=c.getAttribute('data-done')||'Copied';
  navigator.clipboard.writeText(t.value||'').then(function(){var o=c.textContent;c.textContent=d;setTimeout(function(){c.textContent=o},1600)});});
})();</script>
